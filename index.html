<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Ticker</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#ticker {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.game {
    width: 100%;
    text-align: center;
}

.competition {
    font-size: 22px;
    opacity: 0.65;
    margin-bottom: 25px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.teams {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 60px;
}

.team {
    width: 220px;
    font-size: 26px;
    font-weight: bold;
}

.logo {
    width: 70px;
    height: 70px;
    object-fit: contain;
    display: block;
    margin: 0 auto 15px;
}

.score {
    font-size: 65px;
    font-weight: bold;
    min-width: 150px;
}

.status {
    margin-top: 15px;
    font-size: 20px;
    opacity: 0.75;
}

.message {
    font-size: 30px;
    opacity: 0.7;
}

</style>
</head>

<body>

<div id="ticker">
    <div class="message">
        Loading football scores...
    </div>
</div>

<script>

const API_URL =
    "https://footballapi.reidfinn756.workers.dev/scores";

let games = [];
let currentGame = 0;


/* Load scores */

async function loadScores() {

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("API error");
        }

        const data = await response.json();

        games = data.games || [];

        if (currentGame >= games.length) {
            currentGame = 0;
        }

        showGame();

    } catch (error) {

        console.log(error);

        document.getElementById("ticker").innerHTML =
            '<div class="message">Unable to load scores</div>';
    }
}


/* Display current game */

function showGame() {

    const ticker =
        document.getElementById("ticker");

    if (games.length === 0) {

        ticker.innerHTML =
            '<div class="message">No football games today</div>';

        return;
    }

    const game = games[currentGame];

    ticker.innerHTML = `

        <div class="game">

            <div class="competition">
                ${game.competition}
            </div>

            <div class="teams">

                <div class="team">

                    <img
                        class="logo"
                        src="${game.away.logo}"
                    >

                    ${game.away.name}

                </div>


                <div>

                    <div class="score">

                        ${game.away.score}
                        -
                        ${game.home.score}

                    </div>

                    <div class="status">

                        ${game.elapsed
                            ? game.elapsed + "'"
                            : game.status}

                    </div>

                </div>


                <div class="team">

                    <img
                        class="logo"
                        src="${game.home.logo}"
                    >

                    ${game.home.name}

                </div>

            </div>

        </div>
    `;
}


/* Move to next game */

function nextGame() {

    if (games.length === 0) {
        return;
    }

    currentGame++;

    if (currentGame >= games.length) {
        currentGame = 0;
    }

    showGame();
}


/*
   Change 8000 to change
   how long each game stays
   on screen.

   8000 = 8 seconds
*/

setInterval(nextGame, 8000);


/*
   Refresh live scores
   every 15 seconds.
*/

setInterval(loadScores, 15000);


/* Initial load */

loadScores();

</script>

</body>
</html>
