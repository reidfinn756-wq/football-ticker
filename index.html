<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Scores</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #050505;
    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#ticker {

    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 5vh 6vw;

}

.game {

    width: 100%;
    max-width: 1500px;

    text-align: center;

}

.competition {

    font-size:
        clamp(18px, 2.2vw, 32px);

    font-weight: 700;

    letter-spacing: 3px;

    text-transform: uppercase;

    opacity: 0.65;

    margin-bottom: 7vh;

}

.teams {

    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    column-gap: 4vw;

}

.team-container {

    display: flex;

    align-items: center;

    gap: 2vw;

}

.home-container {

    justify-content: flex-end;

}

.away-container {

    justify-content: flex-start;

}

.team {

    font-size:
        clamp(24px, 4vw, 58px);

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}

.home {

    text-align: right;

}

.away {

    text-align: left;

}

.logo {

    width:
        clamp(65px, 8vw, 125px);

    height:
        clamp(65px, 8vw, 125px);

    object-fit: contain;

    flex-shrink: 0;

    filter:
        drop-shadow(0 2px 5px rgba(0,0,0,0.5));

}

.score-area {

    min-width: 220px;

}

.score {

    font-size:
        clamp(60px, 9vw, 130px);

    font-weight: 800;

    line-height: 1;

    letter-spacing: 5px;

}

.status {

    margin-top: 20px;

    font-size:
        clamp(18px, 2vw, 30px);

    font-weight: 600;

    opacity: 0.7;

}

.status.live {

    opacity: 1;

}

.message {

    font-size:
        clamp(24px, 4vw, 55px);

    font-weight: 700;

    text-align: center;

}

.counter {

    position: fixed;

    bottom: 25px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 15px;

    opacity: 0.35;

}

</style>
</head>


<body>


<div id="ticker">

    <div class="message">

        Loading football scores...

    </div>

</div>


<script>


/*
 * Cloudflare Worker
 */

const API_URL =
    "https://footballapi.reidfinn756.workers.dev/scores";


let games = [];

let currentGame = 0;


/*
 * Logo base URL
 *
 * These are the 2026/27 logos from
 * the football-logos GitHub repository.
 */

const LOGO_BASE =
    "https://raw.githubusercontent.com/luukhopman/football-logos/master/logos/England%20-%20Premier%20League/";


/*
 * Team logo mapping
 *
 * The names match the names returned
 * by your KickoffAPI data.
 */

const LOGOS = {

    "AFC Bournemouth":
        "AFC%20Bournemouth.png",

    "Arsenal FC":
        "Arsenal%20FC.png",

    "Aston Villa FC":
        "Aston%20Villa.png",

    "Brentford FC":
        "Brentford%20FC.png",

    "Brighton & Hove Albion FC":
        "Brighton%20%26%20Hove%20Albion.png",

    "Chelsea FC":
        "Chelsea%20FC.png",

    "Crystal Palace FC":
        "Crystal%20Palace.png",

    "Everton FC":
        "Everton%20FC.png",

    "Fulham FC":
        "Fulham%20FC.png",

    "Leeds United FC":
        "Leeds%20United.png",

    "Liverpool FC":
        "Liverpool%20FC.png",

    "Manchester City FC":
        "Manchester%20City.png",

    "Manchester United FC":
        "Manchester%20United.png",

    "Newcastle United FC":
        "Newcastle%20United.png",

    "Nottingham Forest FC":
        "Nottingham%20Forest.png",

    "Sunderland AFC":
        "Sunderland%20AFC.png",

    "Tottenham Hotspur FC":
        "Tottenham%20Hotspur.png",

    "West Ham United FC":
        "West%20Ham%20United.png",

    "Wolverhampton Wanderers FC":
        "Wolverhampton%20Wanderers.png",

    "Burnley FC":
        "Burnley%20FC.png"

};


/*
 * Get logo URL
 */

function getLogo(teamName) {

    const file =
        LOGOS[teamName];

    if (!file) {

        return "";

    }

    return LOGO_BASE + file;

}


/*
 * Format kickoff time
 */

function formatKickoff(date) {

    return new Date(date).toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/*
 * Get game status
 */

function getStatus(game) {

    const status =
        game.status?.short || "";


    if (

        status === "1H" ||
        status === "2H" ||
        status === "HT" ||
        status === "ET" ||
        status === "P"

    ) {

        const elapsed =
            game.status?.elapsed;


        return {

            text:
                elapsed != null
                    ? `LIVE ${elapsed}'`
                    : "LIVE",

            live: true

        };

    }


    if (

        status === "FT" ||
        status === "AET" ||
        status === "PEN"

    ) {

        return {

            text: "FULL TIME",

            live: false

        };

    }


    return {

        text:
            formatKickoff(game.date),

        live: false

    };

}


/*
 * Safely get score
 */

function getScore(score) {

    if (

        score === null ||
        score === undefined ||
        score === ""

    ) {

        return "-";

    }

    return score;

}


/*
 * Display game
 */

function showGame() {

    const ticker =
        document.getElementById(
            "ticker"
        );


    if (!games.length) {

        ticker.innerHTML = `

            <div class="message">

                No football games available

            </div>

        `;

        return;

    }


    if (
        currentGame >= games.length
    ) {

        currentGame = 0;

    }


    const game =
        games[currentGame];


    const homeName =
        game.home?.name ||
        "Home";


    const awayName =
        game.away?.name ||
        "Away";


    const homeScore =
        getScore(
            game.score?.home
        );


    const awayScore =
        getScore(
            game.score?.away
        );


    const status =
        getStatus(game);


    const competition =
        game.competition ||
        "Football";


    const homeLogo =
        getLogo(homeName);


    const awayLogo =
        getLogo(awayName);


    ticker.innerHTML = `

        <div class="game">


            <div class="competition">

                ${competition}

            </div>


            <div class="teams">


                <div class="team-container home-container">

                    <div class="team home">

                        ${homeName}

                    </div>


                    ${
                        homeLogo
                            ? `
                                <img
                                    class="logo"
                                    src="${homeLogo}"
                                    alt="${homeName}"
                                >
                              `
                            : ""
                    }

                </div>


                <div class="score-area">


                    <div class="score">

                        ${homeScore}
                        -
                        ${awayScore}

                    </div>


                    <div
                        class="status ${
                            status.live
                                ? "live"
                                : ""
                        }"
                    >

                        ${status.text}

                    </div>


                </div>


                <div class="team-container away-container">


                    ${
                        awayLogo
                            ? `
                                <img
                                    class="logo"
                                    src="${awayLogo}"
                                    alt="${awayName}"
                                >
                              `
                            : ""
                    }


                    <div class="team away">

                        ${awayName}

                    </div>


                </div>


            </div>


            <div class="counter">

                ${currentGame + 1}
                /
                ${games.length}

            </div>


        </div>

    `;

}


/*
 * Load scores
 */

async function loadScores() {

    try {

        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "API request failed"
            );

        }


        const data =
            await response.json();


        games =
            Array.isArray(data.games)
                ? data.games
                : [];


        if (
            currentGame >= games.length
        ) {

            currentGame = 0;

        }


        showGame();


    } catch (error) {

        console.error(
            "Score loading error:",
            error
        );


        document.getElementById(
            "ticker"
        ).innerHTML = `

            <div class="message">

                Unable to load scores

            </div>

        `;

    }

}


/*
 * Move to next game
 */

function nextGame() {

    if (!games.length) {

        return;

    }


    currentGame++;


    if (
        currentGame >= games.length
    ) {

        currentGame = 0;

    }


    showGame();

}


/*
 * Initial load
 */

loadScores();


/*
 * Refresh scores every 15 seconds
 */

setInterval(

    loadScores,

    15000

);


/*
 * Rotate games every 8 seconds
 */

setInterval(

    nextGame,

    8000

);


</script>

</body>
</html>
