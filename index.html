<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Scores</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

#ticker {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 60px;
}

.game {
    width: 100%;
    max-width: 1500px;
    text-align: center;
    animation: fadeIn 0.18s ease-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

.competition {
    font-size: clamp(18px, 2vw, 30px);
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.65;
    margin-bottom: 70px;
}

.teams {
    display: grid;
    grid-template-columns: 1fr 260px 1fr;
    align-items: center;
    gap: 40px;
}

.team-container {
    display: flex;
    align-items: center;
    gap: 30px;
    min-width: 0;
}

.home-container {
    justify-content: flex-end;
}

.away-container {
    justify-content: flex-start;
}

.team {
    font-size: clamp(28px, 4vw, 62px);
    font-weight: 700;
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.home {
    text-align: right;
}

.away {
    text-align: left;
}

.logo {
    width: clamp(75px, 9vw, 135px);
    height: clamp(75px, 9vw, 135px);
    object-fit: contain;
    flex-shrink: 0;
    filter: drop-shadow(0 3px 7px rgba(0,0,0,0.65));
}

.score-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.score {
    font-size: clamp(65px, 9vw, 135px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: 6px;
    white-space: nowrap;
}

.status {
    margin-top: 24px;
    font-size: clamp(18px, 2vw, 30px);
    font-weight: 700;
    letter-spacing: 2px;
    opacity: 0.65;
}

.status.live {
    opacity: 1;
}

.message {
    font-size: clamp(24px, 4vw, 55px);
    font-weight: 700;
    text-align: center;
}

@media (max-width: 800px) {

    #ticker {
        padding: 25px;
    }

    .competition {
        margin-bottom: 45px;
    }

    .teams {
        grid-template-columns: 1fr 150px 1fr;
        gap: 15px;
    }

    .team-container {
        gap: 12px;
    }

    .logo {
        width: 70px;
        height: 70px;
    }
}

@media (max-width: 550px) {

    .teams {
        grid-template-columns: 1fr;
        gap: 30px;
    }

    .home-container,
    .away-container {
        justify-content: center;
    }

    .home,
    .away {
        text-align: center;
    }

    .score-area {
        order: 3;
    }
}
</style>
</head>

<body>

<div id="ticker">
    <div class="message">
        Loading football scores...
    </div>
</div>

<script>

const API_URL =
    "https://footballapi.reidfinn756.workers.dev/scores";

let games = [];
let currentGame = 0;


/*
 * Logo source
 */

const LOGO_BASE =
    "https://raw.githubusercontent.com/luukhopman/football-logos/master/logos/England%20-%20Premier%20League/";


/*
 * Team logo mapping
 */

const LOGOS = {

    "AFC Bournemouth":
        "AFC%20Bournemouth.png",

    "Arsenal FC":
        "Arsenal%20FC.png",

    "Aston Villa FC":
        "Aston%20Villa.png",

    "Brentford FC":
        "Brentford%20FC.png",

    "Brighton & Hove Albion FC":
        "Brighton%20%26%20Hove%20Albion.png",

    "Chelsea FC":
        "Chelsea%20FC.png",

    "Coventry City FC":
        "Coventry%20City.png",

    "Crystal Palace FC":
        "Crystal%20Palace.png",

    "Everton FC":
        "Everton%20FC.png",

    "Fulham FC":
        "Fulham%20FC.png",

    "Hull City AFC":
        "Hull%20City.png",

    "Leeds United FC":
        "Leeds%20United.png",

    "Liverpool FC":
        "Liverpool%20FC.png",

    "Manchester City FC":
        "Manchester%20City.png",

    "Manchester United FC":
        "Manchester%20United.png",

    "Newcastle United FC":
        "Newcastle%20United.png",

    "Nottingham Forest FC":
        "Nottingham%20Forest.png",

    "Sunderland AFC":
        "Sunderland%20AFC.png",

    "Tottenham Hotspur FC":
        "Tottenham%20Hotspur.png",

    "West Ham United FC":
        "West%20Ham%20United.png",

    "Wolverhampton Wanderers FC":
        "Wolverhampton%20Wanderers.png",

    "Burnley FC":
        "Burnley%20FC.png"
};


/*
 * Get a team's logo
 */

function getLogo(teamName) {

    const file = LOGOS[teamName];

    if (!file) {
        return "";
    }

    return LOGO_BASE + file;
}


/*
 * Preload all logos currently being used.
 *
 * This means the next fixture should already
 * have its badges downloaded before it appears.
 */

function preloadLogos() {

    const urls = new Set();

    games.forEach(game => {

        const homeLogo =
            getLogo(game.home?.name);

        const awayLogo =
            getLogo(game.away?.name);

        if (homeLogo) {
            urls.add(homeLogo);
        }

        if (awayLogo) {
            urls.add(awayLogo);
        }
    });

    urls.forEach(url => {

        const image = new Image();

        image.src = url;

    });
}


/*
 * Convert UTC API time into UK time.
 */

function formatKickoff(date) {

    return new Date(date).toLocaleTimeString(
        "en-GB",
        {
            timeZone: "Europe/London",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }
    );
}


/*
 * Determine match status.
 */

function getStatus(game) {

    const status =
        game.status?.short || "";


    /*
     * Live
     */

    if (
        status === "1H" ||
        status === "2H" ||
        status === "HT" ||
        status === "ET" ||
        status === "P"
    ) {

        const elapsed =
            game.status?.elapsed;

        return {

            text:
                elapsed !== null &&
                elapsed !== undefined
                    ? `● LIVE ${elapsed}'`
                    : "● LIVE",

            live: true

        };
    }


    /*
     * Finished
     */

    if (
        status === "FT" ||
        status === "AET" ||
        status === "PEN"
    ) {

        return {

            text: "FULL TIME",

            live: false

        };
    }


    /*
     * Upcoming
     */

    return {

        text: formatKickoff(game.date),

        live: false

    };
}


/*
 * Prevent undefined scores.
 */

function getScore(score) {

    if (
        score === null ||
        score === undefined ||
        score === ""
    ) {

        return "-";

    }

    return score;
}


/*
 * Display current fixture.
 */

function showGame() {

    const ticker =
        document.getElementById("ticker");


    if (!games.length) {

        ticker.innerHTML = `

            <div class="message">
                No football games available
            </div>

        `;

        return;
    }


    if (
        currentGame >= games.length
    ) {

        currentGame = 0;

    }


    const game =
        games[currentGame];


    const homeName =
        game.home?.name ||
        "Home";


    const awayName =
        game.away?.name ||
        "Away";


    const homeScore =
        getScore(
            game.score?.home
        );


    const awayScore =
        getScore(
            game.score?.away
        );


    const status =
        getStatus(game);


    const competition =
        game.competition ||
        "Football";


    const homeLogo =
        getLogo(homeName);


    const awayLogo =
        getLogo(awayName);


    ticker.innerHTML = `

        <div class="game">


            <div class="competition">

                ${competition}

            </div>


            <div class="teams">


                <!-- HOME -->

                <div class="team-container home-container">

                    <div class="team home">

                        ${homeName}

                    </div>


                    ${
                        homeLogo
                            ? `
                                <img
                                    class="logo"
                                    src="${homeLogo}"
                                    alt="${homeName}"
                                >
                              `
                            : ""
                    }

                </div>


                <!-- SCORE -->

                <div class="score-area">

                    <div class="score">

                        ${homeScore} - ${awayScore}

                    </div>


                    <div
                        class="status ${
                            status.live
                                ? "live"
                                : ""
                        }"
                    >

                        ${status.text}

                    </div>

                </div>


                <!-- AWAY -->

                <div class="team-container away-container">


                    ${
                        awayLogo
                            ? `
                                <img
                                    class="logo"
                                    src="${awayLogo}"
                                    alt="${awayName}"
                                >
                              `
                            : ""
                    }


                    <div class="team away">

                        ${awayName}

                    </div>

                </div>


            </div>

        </div>

    `;
}


/*
 * Load fixture data.
 */

async function loadScores() {

    try {

        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "API request failed"
            );

        }


        const data =
            await response.json();


        games =
            Array.isArray(data.games)
                ? data.games
                : [];


        if (
            currentGame >= games.length
        ) {

            currentGame = 0;

        }


        /*
         * Download all badges before
         * displaying the updated list.
         */

        preloadLogos();


        showGame();


    } catch (error) {

        console.error(
            "Score loading error:",
            error
        );


        document.getElementById(
            "ticker"
        ).innerHTML = `

            <div class="message">

                Unable to load scores

            </div>

        `;
    }
}


/*
 * Move to next fixture.
 */

function nextGame() {

    if (!games.length) {
        return;
    }


    currentGame++;


    if (
        currentGame >= games.length
    ) {

        currentGame = 0;

    }


    showGame();

}


/*
 * Start.
 */

loadScores();


/*
 * Refresh API data every 15 seconds.
 */

setInterval(
    loadScores,
    15000
);


/*
 * Change fixture every 8 seconds.
 */

setInterval(
    nextGame,
    8000
);

</script>

</body>
</html>
