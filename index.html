<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Scores</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #050505;
    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#ticker {

    width: 100vw;
    height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 5vh 6vw;

}

.game {

    width: 100%;
    max-width: 1500px;

    text-align: center;

}

.competition {

    font-size:
        clamp(18px, 2.2vw, 32px);

    font-weight: 700;

    letter-spacing: 3px;

    text-transform: uppercase;

    opacity: 0.65;

    margin-bottom: 7vh;

}

.teams {

    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    column-gap: 5vw;

}

.team {

    font-size:
        clamp(24px, 4vw, 58px);

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}

.home {

    text-align: right;

}

.away {

    text-align: left;

}

.score-area {

    min-width: 220px;

}

.score {

    font-size:
        clamp(60px, 9vw, 130px);

    font-weight: 800;

    line-height: 1;

    letter-spacing: 5px;

}

.status {

    margin-top: 20px;

    font-size:
        clamp(18px, 2vw, 30px);

    font-weight: 600;

    opacity: 0.7;

}

.status.live {

    opacity: 1;

}

.message {

    font-size:
        clamp(24px, 4vw, 55px);

    font-weight: 700;

    text-align: center;

}

.counter {

    position: fixed;

    bottom: 25px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 15px;

    opacity: 0.35;

}

</style>
</head>


<body>


<div id="ticker">

    <div class="message">

        Loading football scores...

    </div>

</div>


<script>


/*
 * Cloudflare Worker
 */

const API_URL =
    "https://footballapi.reidfinn756.workers.dev/scores";


/*
 * Current games
 */

let games = [];


/*
 * Current position
 */

let currentGame = 0;


/*
 * Format kickoff time
 */

function formatKickoff(date) {

    return new Date(date).toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/*
 * Get game status
 */

function getStatus(game) {

    const status =
        game.status?.short || "";


    /*
     * Live game
     */

    if (

        status === "1H" ||
        status === "2H" ||
        status === "HT" ||
        status === "ET" ||
        status === "P"

    ) {

        const elapsed =
            game.status?.elapsed;


        return {

            text:
                elapsed != null
                    ? `LIVE ${elapsed}'`
                    : "LIVE",

            live: true

        };

    }


    /*
     * Finished game
     */

    if (

        status === "FT" ||
        status === "AET" ||
        status === "PEN"

    ) {

        return {

            text: "FULL TIME",

            live: false

        };

    }


    /*
     * Upcoming game
     */

    return {

        text:
            formatKickoff(game.date),

        live: false

    };

}


/*
 * Safely get score
 *
 * Upcoming games have null scores.
 */

function getScore(score) {

    if (
        score === null ||
        score === undefined ||
        score === ""
    ) {

        return "-";

    }

    return score;

}


/*
 * Display current game
 */

function showGame() {

    const ticker =
        document.getElementById(
            "ticker"
        );


    /*
     * No games
     */

    if (!games.length) {

        ticker.innerHTML = `

            <div class="message">

                No football games available

            </div>

        `;

        return;

    }


    /*
     * Keep position valid
     */

    if (
        currentGame >= games.length
    ) {

        currentGame = 0;

    }


    const game =
        games[currentGame];


    /*
     * Safely get scores
     */

    const homeScore =
        getScore(
            game.score?.home
        );


    const awayScore =
        getScore(
            game.score?.away
        );


    /*
     * Get status
     */

    const status =
        getStatus(game);


    /*
     * Team names
     */

    const homeName =
        game.home?.name ||
        "Home";


    const awayName =
        game.away?.name ||
        "Away";


    /*
     * Competition

     */

    const competition =
        game.competition ||
        "Football";


    /*
     * Render ticker
     */

    ticker.innerHTML = `

        <div class="game">


            <div class="competition">

                ${competition}

            </div>


            <div class="teams">


                <div class="team home">

                    ${homeName}

                </div>


                <div class="score-area">


                    <div class="score">

                        ${homeScore}
                        -
                        ${awayScore}

                    </div>


                    <div
                        class="status ${
                            status.live
                                ? "live"
                                : ""
                        }"
                    >

                        ${status.text}

                    </div>


                </div>


                <div class="team away">

                    ${awayName}

                </div>


            </div>


            <div class="counter">

                ${currentGame + 1}
                /
                ${games.length}

            </div>


        </div>

    `;

}


/*
 * Load football scores
 */

async function loadScores() {

    try {


        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "API request failed"
            );

        }


        const data =
            await response.json();


        /*
         * Get games from Worker
         */

        games =
            Array.isArray(data.games)
                ? data.games
                : [];


        /*
         * Make sure current
         * position is valid
         */

        if (
            currentGame >= games.length
        ) {

            currentGame = 0;

        }


        /*
         * Display game
         */

        showGame();


    } catch (error) {


        console.error(
            "Score loading error:",
            error
        );


        document.getElementById(
            "ticker"
        ).innerHTML = `

            <div class="message">

                Unable to load scores

            </div>

        `;

    }

}


/*
 * Move to next game
 */

function nextGame() {

    if (!games.length) {

        return;

    }


    currentGame++;


    if (
        currentGame >= games.length
    ) {

        currentGame = 0;

    }


    showGame();

}


/*
 * Load immediately
 */

loadScores();


/*
 * Refresh scores every 15 seconds
 */

setInterval(

    loadScores,

    15000

);


/*
 * Move to next fixture
 * every 8 seconds
 */

setInterval(

    nextGame,

    8000

);


</script>

</body>
</html>
