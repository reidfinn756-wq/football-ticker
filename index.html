<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Scores</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

#ticker {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 40px 60px;
}

.game {
    width: 100%;
    max-width: 1500px;
    text-align: center;

    opacity: 1;

    transition: opacity 0.12s ease;
}

.game.hidden {
    opacity: 0;
}

.competition {
    font-size: clamp(18px, 2vw, 30px);

    font-weight: 700;

    letter-spacing: 4px;

    text-transform: uppercase;

    opacity: 0.65;

    margin-bottom: 70px;
}

.teams {
    display: grid;

    grid-template-columns:
        1fr
        260px
        1fr;

    align-items: center;

    gap: 40px;
}

.team-container {
    display: flex;

    align-items: center;

    gap: 30px;

    min-width: 0;
}

.home-container {
    justify-content: flex-end;
}

.away-container {
    justify-content: flex-start;
}

.team {
    font-size: clamp(28px, 4vw, 62px);

    font-weight: 700;

    line-height: 1.05;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.home {
    text-align: right;
}

.away {
    text-align: left;
}

.logo {
    width: clamp(75px, 9vw, 135px);

    height: clamp(75px, 9vw, 135px);

    object-fit: contain;

    flex-shrink: 0;

    filter:
        drop-shadow(
            0 3px 7px rgba(0,0,0,0.65)
        );
}

.score-area {
    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}

.score {
    font-size: clamp(65px, 9vw, 135px);

    font-weight: 800;

    line-height: 0.95;

    letter-spacing: 6px;

    white-space: nowrap;
}

.status {
    margin-top: 24px;

    font-size: clamp(18px, 2vw, 30px);

    font-weight: 700;

    letter-spacing: 2px;

    opacity: 0.65;
}

.status.live {
    opacity: 1;
}

.message {
    font-size: clamp(24px, 4vw, 55px);

    font-weight: 700;

    text-align: center;
}

@media (max-width: 800px) {

    #ticker {
        padding: 25px;
    }

    .competition {
        margin-bottom: 45px;
    }

    .teams {
        grid-template-columns:
            1fr
            150px
            1fr;

        gap: 15px;
    }

    .team-container {
        gap: 12px;
    }

    .logo {
        width: 70px;
        height: 70px;
    }
}

@media (max-width: 550px) {

    .teams {
        grid-template-columns: 1fr;

        gap: 30px;
    }

    .home-container,
    .away-container {
        justify-content: center;
    }

    .home,
    .away {
        text-align: center;
    }

    .score-area {
        order: 3;
    }

}

</style>
</head>

<body>

<div id="ticker">

    <div class="game" id="game">

        <div
            class="competition"
            id="competition"
        >
            Loading football scores...
        </div>


        <div class="teams">

            <!-- HOME -->

            <div class="team-container home-container">

                <div
                    class="team home"
                    id="homeName"
                >
                    -
                </div>


                <img
                    class="logo"
                    id="homeLogo"
                    alt=""
                    style="display:none;"
                >

            </div>


            <!-- SCORE -->

            <div class="score-area">

                <div
                    class="score"
                    id="score"
                >
                    - - -
                </div>


                <div
                    class="status"
                    id="status"
                >
                    Loading
                </div>

            </div>


            <!-- AWAY -->

            <div class="team-container away-container">

                <img
                    class="logo"
                    id="awayLogo"
                    alt=""
                    style="display:none;"
                >


                <div
                    class="team away"
                    id="awayName"
                >
                    -
                </div>

            </div>

        </div>

    </div>

</div>


<script>

/*
==================================================
CONFIG
==================================================
*/

const API_URL =
    "https://footballapi.reidfinn756.workers.dev/scores";


/*
==================================================
STATE
==================================================
*/

let games = [];

let currentGame = 0;


/*
==================================================
LOGOS
==================================================
*/

const LOGO_BASE =
    "https://raw.githubusercontent.com/luukhopman/football-logos/master/logos/England%20-%20Premier%20League/";


const LOGOS = {

    "AFC Bournemouth":
        "AFC%20Bournemouth.png",

    "Arsenal FC":
        "Arsenal%20FC.png",

    "Aston Villa FC":
        "Aston%20Villa.png",

    "Brentford FC":
        "Brentford%20FC.png",

    "Brighton & Hove Albion FC":
        "Brighton%20%26%20Hove%20Albion.png",

    "Chelsea FC":
        "Chelsea%20FC.png",

    "Coventry City FC":
        "Coventry%20City.png",

    "Crystal Palace FC":
        "Crystal%20Palace.png",

    "Everton FC":
        "Everton%20FC.png",

    "Fulham FC":
        "Fulham%20FC.png",

    "Hull City AFC":
        "Hull%20City.png",

    "Leeds United FC":
        "Leeds%20United.png",

    "Liverpool FC":
        "Liverpool%20FC.png",

    "Manchester City FC":
        "Manchester%20City.png",

    "Manchester United FC":
        "Manchester%20United.png",

    "Newcastle United FC":
        "Newcastle%20United.png",

    "Nottingham Forest FC":
        "Nottingham%20Forest.png",

    "Sunderland AFC":
        "Sunderland%20AFC.png",

    "Tottenham Hotspur FC":
        "Tottenham%20Hotspur.png",

    "West Ham United FC":
        "West%20Ham%20United.png",

    "Wolverhampton Wanderers FC":
        "Wolverhampton%20Wanderers.png",

    "Burnley FC":
        "Burnley%20FC.png"

};


/*
==================================================
ELEMENTS
==================================================
*/

const gameElement =
    document.getElementById("game");

const competitionElement =
    document.getElementById("competition");

const homeNameElement =
    document.getElementById("homeName");

const awayNameElement =
    document.getElementById("awayName");

const homeLogoElement =
    document.getElementById("homeLogo");

const awayLogoElement =
    document.getElementById("awayLogo");

const scoreElement =
    document.getElementById("score");

const statusElement =
    document.getElementById("status");


/*
==================================================
GET LOGO
==================================================
*/

function getLogo(teamName) {

    const file =
        LOGOS[teamName];

    if (!file) {
        return "";
    }

    return LOGO_BASE + file;
}


/*
==================================================
PRELOAD LOGOS
==================================================
*/

function preloadLogos() {

    const urls = new Set();


    games.forEach(game => {

        const homeLogo =
            getLogo(
                game.home?.name
            );

        const awayLogo =
            getLogo(
                game.away?.name
            );


        if (homeLogo) {
            urls.add(homeLogo);
        }


        if (awayLogo) {
            urls.add(awayLogo);
        }

    });


    urls.forEach(url => {

        const image =
            new Image();

        image.src = url;

    });

}


/*
==================================================
FORMAT UK TIME
==================================================
*/

function formatKickoff(date) {

    return new Date(date)
        .toLocaleTimeString(
            "en-GB",
            {
                timeZone:
                    "Europe/London",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                hour12:
                    false
            }
        );

}


/*
==================================================
STATUS
==================================================
*/

function getStatus(game) {

    const status =
        game.status?.short || "";


    /*
    LIVE
    */

    if (
        status === "1H" ||
        status === "2H" ||
        status === "HT" ||
        status === "ET" ||
        status === "P"
    ) {

        const elapsed =
            game.status?.elapsed;


        return {

            text:
                elapsed !== null &&
                elapsed !== undefined

                    ? `● LIVE ${elapsed}'`

                    : "● LIVE",

            live: true

        };

    }


    /*
    FINISHED
    */

    if (
        status === "FT" ||
        status === "AET" ||
        status === "PEN"
    ) {

        return {

            text:
                "FULL TIME",

            live:
                false

        };

    }


    /*
    UPCOMING
    */

    return {

        text:
            formatKickoff(
                game.date
            ),

        live:
            false

    };

}


/*
==================================================
SCORE
==================================================
*/

function getScore(score) {

    if (
        score === null ||
        score === undefined ||
        score === ""
    ) {

        return "-";

    }

    return score;

}


/*
==================================================
UPDATE LOGO
==================================================
*/

function updateLogo(
    element,
    url,
    teamName
) {

    if (!url) {

        element.style.display =
            "none";

        element.removeAttribute(
            "src"
        );

        return;

    }


    element.alt =
        teamName;


    /*
    Because logos were preloaded,
    this should already be cached.
    */

    element.src =
        url;


    element.style.display =
        "block";

}


/*
==================================================
RENDER FIXTURE
==================================================
*/

function renderGame(game) {

    if (!game) {
        return;
    }


    const homeName =
        game.home?.name ||
        "Home";


    const awayName =
        game.away?.name ||
        "Away";


    const homeScore =
        getScore(
            game.score?.home
        );


    const awayScore =
        getScore(
            game.score?.away
        );


    const status =
        getStatus(game);


    const competition =
        game.competition ||
        "Football";


    const homeLogo =
        getLogo(homeName);


    const awayLogo =
        getLogo(awayName);


    /*
    Update text only.
    We do NOT rebuild the page.
    */

    competitionElement.textContent =
        competition;


    homeNameElement.textContent =
        homeName;


    awayNameElement.textContent =
        awayName;


    scoreElement.textContent =
        `${homeScore} - ${awayScore}`;


    statusElement.textContent =
        status.text;


    statusElement.classList.toggle(
        "live",
        status.live
    );


    /*
    Update badges.
    */

    updateLogo(
        homeLogoElement,
        homeLogo,
        homeName
    );


    updateLogo(
        awayLogoElement,
        awayLogo,
        awayName
    );

}


/*
==================================================
CHANGE FIXTURE
==================================================
*/

function changeGame(
    newIndex
) {

    if (!games.length) {
        return;
    }


    /*
    Keep index valid.
    */

    if (
        newIndex < 0
    ) {

        newIndex =
            games.length - 1;

    }


    if (
        newIndex >= games.length
    ) {

        newIndex = 0;

    }


    currentGame =
        newIndex;


    /*
    Very short fade.
    */

    gameElement.classList.add(
        "hidden"
    );


    /*
    Update during the fade,
    rather than rebuilding the DOM.
    */

    setTimeout(
        () => {

            renderGame(
                games[currentGame]
            );


            gameElement.classList.remove(
                "hidden"
            );

        },

        60
    );

}


/*
==================================================
NEXT FIXTURE
==================================================
*/

function nextGame() {

    if (!games.length) {
        return;
    }


    changeGame(
        currentGame + 1
    );

}


/*
==================================================
LOAD SCORES
==================================================
*/

async function loadScores() {

    try {

        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "API request failed"
            );

        }


        const data =
            await response.json();


        const newGames =
            Array.isArray(
                data.games
            )
                ? data.games
                : [];


        games =
            newGames;


        if (!games.length) {

            competitionElement.textContent =
                "No football games available";

            homeNameElement.textContent =
                "-";

            awayNameElement.textContent =
                "-";

            scoreElement.textContent =
                "- - -";

            statusElement.textContent =
                "";

            return;

        }


        /*
        Preload all badges BEFORE
        displaying updated data.
        */

        preloadLogos();


        /*
        Keep current fixture when
        the API refreshes.
        */

        if (
            currentGame >= games.length
        ) {

            currentGame = 0;

        }


        renderGame(
            games[currentGame]
        );


    } catch (error) {

        console.error(
            "Score loading error:",
            error
        );


        statusElement.textContent =
            "Unable to load scores";

    }

}


/*
==================================================
INITIAL LOAD
==================================================
*/

loadScores();


/*
==================================================
API REFRESH
Every 15 seconds
==================================================
*/

setInterval(
    loadScores,
    15000
);


/*
==================================================
FIXTURE ROTATION
Every 8 seconds
==================================================
*/

setInterval(
    nextGame,
    8000
);

</script>

</body>
</html>
